<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; frame-src 'self' about: blob:; font-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
<meta name="color-scheme" content="light dark">
<title>@@TITLE@@</title>
<style>
:root{color-scheme:light;--paper:#f4f5f7;--panel:#fff;--ink:#202b3a;--muted:#586476;--line:#dbe1e8;--accent:#245bce;--soft:#edf3ff;--shadow:0 18px 60px #182b4520}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--paper:#141923;--panel:#1d2532;--ink:#edf2fa;--muted:#b5c0d2;--line:#374359;--accent:#96b9ff;--soft:#293952;--shadow:0 18px 60px #0007}}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}button,input,select{font:inherit;color:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}a{color:var(--accent);text-underline-offset:3px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}[hidden]{display:none!important}
.top{display:flex;gap:20px;justify-content:space-between;align-items:center;padding:18px 26px;background:var(--panel);border-bottom:1px solid var(--line)}h1{font-size:23px;letter-spacing:-.03em;line-height:1.3;margin:0}.eyebrow{font-size:11px;letter-spacing:.09em;color:var(--muted);margin-bottom:4px}.top p{margin:5px 0 0;color:var(--muted);font-size:12px}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.button{background:var(--panel);border:1px solid var(--line);border-radius:7px;min-height:36px;padding:6px 11px;white-space:nowrap}.button:hover{background:var(--soft)}.button.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}input,select{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 10px;min-width:0;max-width:100%}.search{position:relative;width:270px}.search input{width:100%}.results{position:absolute;top:calc(100% + 6px);right:0;width:min(420px,90vw);max-height:380px;overflow:auto;z-index:4;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow)}.result{display:block;width:100%;text-align:left;padding:10px 13px;background:none;border:0;border-bottom:1px solid var(--line)}.result:hover{background:var(--soft)}.result small{display:block;color:var(--muted)}
nav{display:flex;gap:4px;padding:12px 26px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line)}.tab{border:0;background:none;border-radius:6px;padding:8px 13px;color:var(--muted)}.tab[aria-selected="true"]{background:var(--soft);color:var(--accent);font-weight:600}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px;padding:16px;max-width:2100px;margin:auto;align-items:start}.graph-panel{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden}.graph-tools{display:flex;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}.graph-tools label{display:flex;gap:8px;align-items:center;min-width:0;flex:1}.graph-tools select{flex:1;max-width:430px}.graph-tools .hint{font-size:11px;color:var(--muted)}iframe{display:block;border:0;width:100%;height:73vh;min-height:540px;background:var(--panel)}.graph-foot{display:flex;gap:12px;padding:10px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}aside{background:var(--panel);border:1px solid var(--line);border-radius:11px;max-height:calc(100vh - 36px);overflow:auto;position:sticky;top:16px}.detail-header{padding:20px;border-bottom:1px solid var(--line);background:var(--soft)}.detail-header h2{font-size:21px;line-height:1.4;margin:6px 0}.meta,.note{font-size:12px;color:var(--muted)}.status{display:inline-block;font-size:11px;padding:1px 7px;border:1px solid var(--line);border-radius:4px}.section{padding:18px 20px;border-bottom:1px solid var(--line)}.section h3{font-size:12px;color:var(--muted);margin:0 0 10px}.section p{margin:0 0 9px;overflow-wrap:anywhere}.item{padding:11px 0;border-top:1px solid var(--line)}.item:first-of-type{border-top:0;padding-top:0}.item strong{display:block;overflow-wrap:anywhere}.item .actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}.item .button{font-size:12px;min-height:31px}.link-button{border:0;background:none;padding:2px 0;text-align:left;color:var(--accent);text-decoration:underline;text-underline-offset:3px}.coverage{margin:0 16px 24px;padding:12px 16px;border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:12px}.coverage summary{cursor:pointer}.coverage p{overflow-wrap:anywhere}.wide .workspace{grid-template-columns:1fr}.wide aside{display:none}.wide iframe{height:78vh}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
dialog{padding:0;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);width:min(1120px,94vw);max-height:90vh;box-shadow:var(--shadow)}dialog::backdrop{background:#071426a0}.modal-head{display:flex;justify-content:space-between;gap:20px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}.modal-head h2{font-size:19px;margin:0;overflow-wrap:anywhere}.modal-sub{font-size:12px;color:var(--muted);padding:10px 20px}.preview{padding:0 20px 20px;min-height:160px}.preview pre{padding:16px;margin:0;background:var(--paper);border:1px solid var(--line);border-radius:8px;font:12px/1.65 ui-monospace,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:60vh;overflow:auto}.preview img{display:block;max-width:100%;height:auto;margin:auto}.path{display:flex;align-items:flex-start;gap:10px;padding:12px 20px;border-top:1px solid var(--line);font-size:11px}.path code{overflow-wrap:anywhere;flex:1}.close{font-size:20px;min-width:36px}.copy-fallback{width:100%;min-height:65px}.notice{padding:8px 16px;color:var(--muted);font-size:12px}
@media(max-width:1100px){.top{align-items:flex-start;padding:16px}.workspace{grid-template-columns:minmax(0,1fr) 320px;gap:10px;padding:10px}.tools{justify-content:flex-end}.search{width:220px}nav{padding:10px 16px}.detail-header,.section{padding:16px}}
@media(max-width:780px){.top{display:block}.tools{justify-content:flex-start;margin-top:12px}.search{flex:1;width:auto;min-width:160px}h1{font-size:22px}.workspace{display:block}.graph-panel{margin-bottom:12px}aside{position:static;max-height:none}.graph-tools{align-items:stretch}.graph-tools label{display:block;flex-basis:100%}.graph-tools select{width:100%;max-width:none;margin-top:4px}iframe{height:560px;min-height:0}.wide iframe{height:650px}.graph-tools .hint{display:none}.tab{padding:8px 10px}.modal-head{align-items:flex-start;gap:10px;padding:12px}.modal-head .tools{margin:0}.modal-head h2{font-size:17px}.path{display:block}.path button{margin-top:8px}.preview{padding:0 12px 12px}.results{left:0;right:auto}input,select{font-size:16px}}

/* Node resources stay visible in the top layer at every viewport width. */
.workspace{grid-template-columns:minmax(0,1fr);max-width:1800px}#node-dialog{width:min(760px,94vw);max-height:88vh;overflow:auto}#node-dialog .detail-header{padding:12px 20px}#node-dialog .detail-header h2{display:none}.resource-link{display:block;font-weight:650;font-size:15px;text-decoration:underline;overflow-wrap:anywhere}.resource-link:hover{background:var(--soft)}#node-dialog .section:first-of-type{background:var(--soft)}

.markdown-body{max-width:82ch;margin:0 auto;line-height:1.8;font-size:15px;overflow-wrap:anywhere}.markdown-body h1,.markdown-body h2,.markdown-body h3,.markdown-body h4{line-height:1.4;margin:1.3em 0 .6em;scroll-margin-top:100px}.markdown-body h1{font-size:27px}.markdown-body h2{font-size:23px;border-bottom:1px solid var(--line);padding-bottom:.3em}.markdown-body h3{font-size:19px}.markdown-body p{margin:.7em 0}.markdown-body ul,.markdown-body ol{padding-left:1.8em}.markdown-body li>p{margin:.25em 0}.markdown-body code{font:13px/1.6 ui-monospace,Consolas,monospace;background:var(--paper);padding:2px 5px;border-radius:4px}.markdown-body pre{max-height:none;padding:14px;background:var(--paper);white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid var(--line);border-radius:8px}.markdown-body pre code{padding:0;background:none}.markdown-body blockquote{margin:1em 0;padding:4px 16px;border-left:3px solid var(--accent);color:var(--muted);background:var(--soft)}.markdown-body img{max-width:100%;height:auto}.md-table{overflow-x:auto;margin:1em 0}.markdown-body table{border-collapse:collapse;width:100%;font-size:14px}.markdown-body th,.markdown-body td{padding:8px 11px;border:1px solid var(--line);text-align:left}.markdown-body th{background:var(--soft)}.markdown-body hr{border:0;border-top:1px solid var(--line);margin:1.5em 0}.technical-details{margin:12px 20px;padding:10px 0;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.technical-details summary{cursor:pointer;min-height:32px}.technical-details p{overflow-wrap:anywhere}.technical-details .path{padding:10px 0;border:0}.file-outline{padding:6px 20px 14px}.file-outline select{width:100%}.conversation-context{margin:12px 20px;padding:14px 16px;background:var(--soft);border:1px solid var(--line);border-radius:8px}.conversation-context h3{margin:0 0 7px;font-size:14px}.conversation-context p{margin:4px 0}.conversation-context .button{margin-top:7px}.conversation-controls{display:flex;gap:9px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line)}.conversation-controls select{max-width:330px;flex:1;min-width:180px}.conversation-controls input{flex:1;min-width:180px}.conversation-grid{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:360px}#conversation-list{max-height:65vh;overflow:auto;border-right:1px solid var(--line)}.conversation-result{display:block;width:100%;text-align:left;padding:13px 16px;background:var(--panel);color:var(--ink);border:0;border-bottom:1px solid var(--line)}.conversation-result span{display:block;font-size:12px;color:var(--muted);margin-top:5px}.conversation-result:hover,.conversation-result[aria-pressed="true"]{background:var(--soft)}#conversation-content{padding:16px 22px;overflow:auto;max-height:65vh;min-width:0}#conversation-content>h3{margin:0 0 8px}#conversation-content .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}#conversation-content .technical-details{margin:18px 0 0}#file-dialog .modal-head .tools{flex-shrink:0}
@media(max-width:780px){.conversation-grid{grid-template-columns:1fr}#conversation-list{max-height:24vh;border-right:0;border-bottom:1px solid var(--line)}#conversation-content{max-height:48vh;padding:14px}.conversation-controls{padding:10px}.markdown-body{font-size:14px}.markdown-body h1{font-size:23px}.markdown-body h2{font-size:20px}#file-dialog .modal-head{flex-wrap:wrap}#file-dialog .modal-head .tools{width:100%}.conversation-context{margin:10px 12px}}
/* One persistent reader panel keeps the diagram and reading context in a single layer. */
.workspace{grid-template-columns:minmax(0,1fr) minmax(340px,440px);max-width:2100px;height:calc(100dvh - 154px);min-height:520px;align-items:stretch}
.workspace.show-graph{grid-template-columns:minmax(0,1fr)}
.graph-panel{display:flex;flex-direction:column;min-height:0;margin:0}
.graph-host{position:relative;flex:1;min-height:0}
.graph-host iframe{position:absolute;inset:0;width:100%;height:100%;min-height:0}
.graph-host iframe[hidden]{display:none}
.graph-foot{align-items:center;flex-wrap:wrap}
.reader-panel{height:100%;max-height:none;min-height:0;position:sticky;top:16px;overflow:hidden;display:flex;flex-direction:column}
.reader-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.reader-bar .history-controls{display:flex;gap:6px}
.reader-bar .button{min-height:34px;padding:5px 9px}
.breadcrumbs{display:flex;gap:5px;align-items:center;flex:1;min-width:160px;overflow:auto;white-space:nowrap;color:var(--muted);font-size:12px}
.breadcrumb{border:0;background:none;color:var(--accent);padding:3px 2px;text-decoration:underline;text-underline-offset:3px}
.reader-heading{margin:0;padding:15px 18px 10px;font-size:17px;line-height:1.4;border-bottom:1px solid var(--line)}
#reader-content{min-height:0;flex:1;overflow:auto;overscroll-behavior:contain;padding:0 0 14px;scrollbar-gutter:stable}
.reader-actions{display:flex;gap:7px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line)}
.reader-actions .button{font-size:12px;min-height:32px}
.reader-section{padding:14px 18px;border-bottom:1px solid var(--line)}
.reader-section h3{font-size:12px;color:var(--muted);margin:0 0 8px}
.reader-section p{margin:0 0 8px;overflow-wrap:anywhere}
.reader-node-title{font-size:19px;line-height:1.35;margin:5px 0 8px}
.reader-node-time{color:var(--muted);font-size:12px}
.result-type{display:inline-block;margin-right:7px;padding:1px 6px;border:1px solid var(--line);border-radius:4px;color:var(--muted);font-size:10px}
.match-context{display:block;margin-top:4px;color:var(--muted);font-size:12px;font-weight:400;line-height:1.45}
.reading-links{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.resource-line{padding:7px 0;border-top:1px solid var(--line)}
.source-line{display:block;white-space:pre-wrap;overflow-wrap:anywhere;padding:0 8px 0 3.5em;position:relative;scroll-margin:35vh}
.source-line::before{content:attr(data-line);position:absolute;left:0;width:2.8em;text-align:right;color:var(--muted);user-select:none}
.locator-target{background:#ffd76a99;box-shadow:inset 3px 0 #d89000}
.markdown-body [data-source-start],.source-line{scroll-margin-block:35vh}
.locator-help{padding:8px 11px;margin:8px 0;background:var(--soft);border-radius:6px;color:var(--muted);font-size:12px}
.conversation-turn{padding:11px;margin:10px 0;border:1px solid var(--line);border-radius:8px}
.conversation-turn[aria-current="true"]{border-color:var(--accent);background:var(--soft)}
.conversation-turn h4{margin:0 0 6px;font-size:13px}
.conversation-turn p{margin:4px 0}
.conversation-turn article{margin-top:8px}
.search{width:min(350px,38vw)}
.search .results{position:fixed;top:78px;right:18px;width:min(520px,calc(100vw - 36px));max-height:min(65vh,620px)}
.results .result{max-height:110px;overflow:hidden}
.results .result strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.coverage{margin:0 16px 18px}
.conversation-grid{grid-template-columns:minmax(0,1fr)}
#conversation-list{max-height:220px;border-right:0;border-bottom:1px solid var(--line)}
#conversation-content{max-height:none;overflow:visible;padding:14px 18px}
.search-group-heading{margin:0;padding:7px 12px;background:var(--soft);font-size:12px;color:var(--muted)}
.search-results-group{border-bottom:1px solid var(--line)}
.raw-source{font:12px/1.65 ui-monospace,Consolas,monospace;overflow:auto}
@media(max-width:900px){.workspace{grid-template-columns:minmax(0,1fr) minmax(300px,390px)}.top{gap:12px;padding:14px}.tools{gap:6px}.search{width:min(260px,35vw)}.workspace{height:calc(100dvh - 150px)}}
@media(max-width:780px){.top{display:flex;flex-direction:column;align-items:stretch}.top .tools{margin-top:8px}.search{flex:1;width:auto;min-width:150px}.workspace{display:block;height:auto;min-height:0;padding:10px}.workspace:not(.show-graph) .graph-panel{display:none}.workspace.show-graph .reader-panel{display:none}.graph-panel{height:calc(100dvh - 170px);min-height:480px;margin:0}.reader-panel{height:calc(100dvh - 175px);position:static;max-height:none}.graph-host{min-height:380px}iframe{height:100%;min-height:0}.graph-foot{font-size:10px}.reader-heading{padding:13px 14px}.reader-section{padding:13px 15px}.search .results{top:118px;left:12px;right:12px;width:auto}#conversation-list{max-height:24vh;border-right:0;border-bottom:1px solid var(--line)}.conversation-controls{padding:10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header class="top"><div><div class="eyebrow">CHAT ARCHIFY / INTERACTIVE</div><h1>@@TITLE@@</h1><p>桌面可并排查看图与资料；窄屏在图和阅读面板间切换。</p></div><div class="tools"><div class="search"><label class="sr" for="search">搜索阶段、文件和对话摘录</label><input id="search" type="search" placeholder="搜索阶段、文件或对话摘录" autocomplete="off"><div class="results" id="results" hidden></div></div><button class="button" id="history-back" aria-label="返回上一阅读位置" title="返回">← 返回</button><button class="button" id="history-forward" aria-label="前往下一阅读位置" title="前进">前进 →</button><button class="button" id="wide">打开阅读面板</button><button class="button" id="conversation-open">对话索引</button><button class="button" id="about">阅读说明</button></div></header>
<nav id="chapters" role="tablist" aria-label="演进主题"></nav>
<main class="workspace show-graph" id="workspace"><section class="graph-panel" aria-label="可交互演进图"><div class="graph-tools"><label for="node-picker">定位阶段<select id="node-picker"></select></label><span class="hint" id="graph-count"></span></div><div class="graph-host" id="viewer-host"></div><div class="graph-foot"><span>拖动／缩放 · 点击节点查看对应资料</span><button class="link-button" id="native-download">下载此主题框图（不含附件）</button></div><div class="notice" id="viewer-note" hidden>图内联动暂不可用，可通过“定位阶段”查看全部节点与附件。</div></section><aside class="reader-panel" id="reader-panel" aria-label="阅读面板" hidden><div class="reader-bar"><div class="history-controls"><button class="button" id="reader-back" aria-label="返回上一阅读位置" title="返回">←</button><button class="button" id="reader-forward" aria-label="前往下一阅读位置" title="前进">→</button></div><div class="breadcrumbs" id="breadcrumbs" aria-label="当前位置"></div><button class="button" id="reader-graph">查看图</button><button class="button" id="reader-close" aria-label="关闭阅读面板">×</button></div><h2 class="reader-heading" id="reader-title" tabindex="-1">选择一个阶段开始阅读</h2><div class="reader-actions" id="reader-actions"></div><div id="reader-content" tabindex="0"></div></aside></main>
<details class="coverage" id="coverage"><summary>来源覆盖与验证边界</summary><div id="coverage-body"></div></details>
<div class="sr" id="announce" role="status" aria-live="polite"></div>
<noscript><p>请在支持 JavaScript 的浏览器中打开此文件，以查看交互框图和内置附件。</p></noscript>
<script type="application/json" id="explorer-data">@@PAYLOAD@@</script>
<script>@@SCRIPT@@</script>
</body>
</html>
